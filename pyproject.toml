[project]
name = "realtime-fraud-streaming"
version = "1.1.0"
description = "Real-time card fraud monitoring: Redpanda, Spark Structured Streaming, Parquet and Streamlit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Alves" }]
# Pinned dependencies live in requirements.txt (pipeline), dashboard/requirements.txt
# (deployed dashboard) and requirements-test.txt (unit tests).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["spark: needs a local SparkSession (Java 17)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".github"]

[tool.ruff.lint]
# ANN: type hints on every function in producer/, spark/ and contract/.
# T20: no print() there; progress goes through logging.
select = ["E", "F", "I", "B", "UP", "ANN", "T20"]
ignore = ["E402", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20"]
"dashboard/**" = ["ANN", "T20", "E501"]
