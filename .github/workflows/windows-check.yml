name: Windows check

# Runs the README on a real Windows machine, with Git Bash and conda as the README says: conda environment,
# Java 17, the Hadoop native binaries in C:\hadoop\bin, the Spark job and the producer. A GitHub Windows
# machine cannot run Linux containers, so the broker here is Apache Kafka (it speaks the same protocol as
# Redpanda and listens on the same port, 19092), and the schema registry is Confluent's community
# Schema Registry (the API Redpanda's built-in registry implements, on the same port, 8081).
# Runs when this file changes, every month and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *"
  push:
    paths:
      - ".github/workflows/windows-check.yml"

permissions:
  contents: read
  actions: write   # only used to keep the monthly schedule enabled (see last step)

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false

      - name: "README step 1: conda environment with Python 3.11 and Java 17"
        run: |
          conda create -n fraud python=3.11 -y
          conda activate fraud
          conda install -c conda-forge openjdk=17 -y
          java -version

      - name: "README step 2: install the dependencies"
        run: |
          conda activate fraud
          pip install -r requirements.txt

      - name: "README, Windows only: Hadoop native binaries in C:\\hadoop\\bin"
        run: |
          mkdir -p /c/hadoop/bin
          base=https://raw.githubusercontent.com/cdarlint/winutils/master/hadoop-3.3.5/bin
          curl -fsSL -o /c/hadoop/bin/winutils.exe "$base/winutils.exe"
          curl -fsSL -o /c/hadoop/bin/hadoop.dll "$base/hadoop.dll"
          ls -la /c/hadoop/bin
          # Spark calls winutils.exe to create its checkpoint folders. If winutils cannot run on this image
          # (missing Visual C++ 2010 runtime, msvcr100.dll), install that runtime and check again.
          w=0; /c/hadoop/bin/winutils.exe ls /c/hadoop/bin > /dev/null 2>&1 || w=$?
          echo "winutils before runtime install: exit $w"
          if [ "$w" != "0" ]; then
            choco install vcredist2010 -y --no-progress > /c/vcredist.log 2>&1 || tail -5 /c/vcredist.log
            w=0; /c/hadoop/bin/winutils.exe ls /c/hadoop/bin > /dev/null 2>&1 || w=$?
            echo "winutils after runtime install: exit $w"
          fi
          [ "$w" = "0" ] || { echo "::error::winutils.exe still fails (exit $w)"; exit 1; }

      - name: "README step 3 (adapted): start a Kafka broker on port 19092 and create the topic with 3 partitions"
        run: |
          conda activate fraud
          # Kafka goes into a SHORT path: its .bat scripts build the classpath jar by jar and overflow
          # cmd.exe's line limit under the long GitHub checkout path
          dl() {
            curl -fsSL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 420 -o kafka.tgz "$1" \
              && [ "$(stat -c %s kafka.tgz)" -gt 50000000 ]
          }
          dl https://archive.apache.org/dist/kafka/3.7.1/kafka_2.13-3.7.1.tgz \
            || dl https://dlcdn.apache.org/kafka/3.9.1/kafka_2.13-3.9.1.tgz \
            || dl https://downloads.apache.org/kafka/3.9.1/kafka_2.13-3.9.1.tgz \
            || dl https://archive.apache.org/dist/kafka/3.9.1/kafka_2.13-3.9.1.tgz \
            || { echo "::error::could not download Kafka from any Apache mirror"; exit 1; }
          mkdir -p /c/k
          tar -xzf kafka.tgz -C /c/k --strip-components=1
          cd /c/k
          cat > config/kraft/windows-test.properties <<'PROPS'
          process.roles=broker,controller
          node.id=1
          controller.quorum.voters=1@localhost:19093
          listeners=PLAINTEXT://localhost:19092,CONTROLLER://localhost:19093
          advertised.listeners=PLAINTEXT://localhost:19092
          controller.listener.names=CONTROLLER
          inter.broker.listener.name=PLAINTEXT
          listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          log.dirs=C:/kafka-logs
          num.partitions=3
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
          PROPS
          K=C:/k
          # The Kafka .bat tools are not used: they need wmic (gone from current Windows images), overflow cmd.exe's
          # line limit and always exit with 0. Java is called directly instead.
          id=$(java -cp "$K/libs/*" kafka.tools.StorageTool random-uuid | tr -d '\r' | tail -1)
          echo "cluster id: $id"
          java -cp "$K/libs/*" kafka.tools.StorageTool format -t "$id" -c "$K/config/kraft/windows-test.properties" > /c/format.log 2>&1 || {
            echo "::error::kafka-storage format failed: $(tail -8 /c/format.log | tr -d '\r' | tr '\n' '|' | cut -c1-900)"; exit 1; }
          nohup java -Xmx1G -Xms1G -Dlog4j.configuration=file:$K/config/log4j.properties -Dkafka.logs.dir=$K/logs \
            -cp "$K/libs/*" kafka.Kafka "$K/config/kraft/windows-test.properties" > /c/kafka.log 2>&1 &
          up=0
          for i in $(seq 1 60); do
            # "|| c=$?" keeps the loop alive under bash -e while the broker is still starting
            c=0; curl -s --connect-timeout 2 -m 3 http://127.0.0.1:19092 >/dev/null 2>&1 || c=$?
            if [ $c -ne 7 ] && [ $c -ne 28 ] && [ $c -ne 6 ]; then up=1; echo "broker port 19092 is open after about $((i*3))s (curl code $c)"; break; fi
            sleep 3
          done
          if [ "$up" != "1" ]; then
            echo "::error::the Kafka broker did not open port 19092: console: $(tail -15 /c/kafka.log | tr -d '\r' | tr '\n' '|' | cut -c1-700) || server.log: $(tail -25 $K/logs/server.log 2>/dev/null | tr -d '\r' | tr '\n' '|' | cut -c1-1200)"
            exit 1
          fi
          sleep 5
          java -cp "$K/libs/*" org.apache.kafka.tools.TopicCommand --bootstrap-server localhost:19092 --create --topic transactions --partitions 3 > /c/topic-create.log 2>&1 || {
            echo "::error::topic creation failed: $(tail -8 /c/topic-create.log | tr -d '\r' | tr '\n' '|' | cut -c1-900)"; exit 1; }
          cat /c/topic-create.log
          java -cp "$K/libs/*" org.apache.kafka.tools.TopicCommand --bootstrap-server localhost:19092 --describe --topic transactions | tee /c/topic.txt
          grep -q "PartitionCount: 3\|PartitionCount:3" /c/topic.txt

      - name: "README step 4 (adapted): start a schema registry on port 8081 and register the schema"
        run: |
          conda activate fraud
          dl() {
            curl -fsSL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 600 -o sr.tgz "$1" \
              && [ "$(stat -c %s sr.tgz)" -gt 50000000 ]
          }
          dl https://packages.confluent.io/archive/7.7/confluent-community-7.7.1.tar.gz \
            || { echo "::error::could not download the Confluent community package"; exit 1; }
          mkdir -p /c/sr
          # Some jars are symlinks into kafka-rest-lib. Git Bash's tar turns a symlink into a copy,
          # which fails when the target is not extracted yet, so extract twice: the first pass
          # creates the targets, the second the copies.
          parts=("*/share/java/schema-registry/*" "*/share/java/confluent-common/*" "*/share/java/rest-utils/*" "*/share/java/kafka-rest-lib/*")
          tar -xzf sr.tgz -C /c/sr --strip-components=1 --wildcards "${parts[@]}" 2>/dev/null || true
          tar -xzf sr.tgz -C /c/sr --strip-components=1 --wildcards "${parts[@]}"
          cat > /c/sr/sr.properties <<'PROPS'
          listeners=http://0.0.0.0:8081
          kafkastore.bootstrap.servers=PLAINTEXT://localhost:19092
          kafkastore.topic=_schemas
          kafkastore.topic.replication.factor=1
          PROPS
          S=C:/sr/share/java
          # Java is called directly, for the same reasons as Kafka above.
          nohup java -Xmx512M -cp "$S/schema-registry/*;$S/confluent-common/*;$S/rest-utils/*;$S/kafka-rest-lib/*" \
            io.confluent.kafka.schemaregistry.rest.SchemaRegistryMain C:/sr/sr.properties > /c/sr.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/subjects >/dev/null; then echo "registry up after about $((i*3))s"; break; fi
            sleep 3
          done
          curl -sf http://127.0.0.1:8081/subjects || { echo "::error::schema registry did not start: $(tail -20 /c/sr.log | tr -d '\r' | tr '\n' '|' | cut -c1-1200)"; exit 1; }
          python contract/registry.py register

      - name: "README step 5: python spark/streaming_job.py"
        run: |
          conda activate fraud
          nohup python spark/streaming_job.py > spark.log 2>&1 &
          sleep 20

      - name: "README step 6: python producer/producer.py"
        run: |
          conda activate fraud
          nohup python producer/producer.py > producer.log 2>&1 &
          sleep 15
          tail -3 producer.log

      - name: Wait until Spark has written real data on Windows (Bronze, then Gold)
        run: |
          conda activate fraud
          python - <<'PY'
          import sys, time
          from deltalake import DeltaTable
          def rows(path):
              try:
                  return len(DeltaTable(path).to_pandas())
              except Exception:
                  return 0
          def wait(path, minimum, seconds, label):
              start = time.time()
              while time.time() - start < seconds:
                  n = rows(path)
                  if n >= minimum:
                      print(f"{label}: {n} rows after {int(time.time() - start)}s")
                      return
                  time.sleep(5)
              print(f"::error::{label}: only {rows(path)} rows after {seconds}s (needed {minimum})")
              sys.exit(1)
          wait("data/delta/bronze", 500, 420, "bronze")
          wait("data/delta/gold", 1, 600, "gold windows")
          PY

      - name: Stop Spark and the producer, then check the output
        run: |
          conda activate fraud
          taskkill //F //IM java.exe || true
          taskkill //F //IM python.exe || true
          sleep 5
          python - <<'PY'
          import sys
          from deltalake import DeltaTable
          b = DeltaTable("data/delta/bronze").to_pandas()
          g = DeltaTable("data/delta/gold").to_pandas()
          print("bronze rows:", len(b), "| gold rows:", len(g), "| gold columns:", list(g.columns))
          need_b = {"transaction_id", "amount", "is_fraud", "event_time", "schema_id"}
          need_g = {"window_start", "tx_count", "total_amount", "fraud_total"}
          if not need_b <= set(b.columns) or not need_g <= set(g.columns) or len(b) < 500 or g["tx_count"].sum() <= 0:
              print(f"::error::unexpected output: bronze={list(b.columns)} gold={list(g.columns)}")
              sys.exit(1)
          if b["schema_id"].isna().all():
              print("::error::no event carried the schema registry id")
              sys.exit(1)
          print("Windows pipeline output ok")
          PY

      - name: Show the logs on failure
        if: failure()
        run: |
          # the first exception lines carry the real cause; the tail is mostly the stack trace
          grep -n -m 6 -A 4 -E "Exception|Error:" spark.log || true
          tail -40 spark.log || true
          tail -20 producer.log || true
          tail -40 /c/kafka.log || true
          tail -40 /c/sr.log || true

      - name: Keep the monthly schedule enabled
        if: ${{ always() && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/windows-check.yml/enable"
