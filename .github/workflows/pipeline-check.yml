name: Pipeline check

# Runs the real pipeline: Redpanda (Docker) -> producer -> Spark Structured
# Streaming (Kafka connector) -> Parquet, then opens the dashboard.
on:
  push:
    paths:
      - requirements.txt
      - "spark/**"
      - "producer/**"
      - "dashboard/**"
      - docker-compose.yml
      - ".github/workflows/pipeline-check.yml"
  workflow_dispatch:

jobs:
  streaming:
    name: Redpanda + Spark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "README step 2: install the dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      # The next steps follow the README ("Running it") in the same order.
      - name: "README step 3, first command: docker compose up -d (Redpanda and the console)"
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' redpanda)" = "healthy" ]; then echo "redpanda is healthy"; break; fi
            sleep 3
          done
          docker compose ps

      - name: "README step 3, second command: create the topic with 3 partitions"
        run: |
          # The README uses "docker exec -it"; -it needs a terminal, which a CI job does not have.
          docker exec redpanda rpk topic create transactions -p 3
          docker exec redpanda rpk topic describe transactions | tee topic.txt
          grep -E "PARTITIONS[[:space:]]+3" topic.txt

      - name: The Redpanda Console answers on port 8080
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080 >/dev/null; then echo "console is up on port 8080"; exit 0; fi
            sleep 3
          done
          echo "::error::the Redpanda Console did not answer on port 8080"
          docker compose logs --tail 30 console || true
          exit 1

      - name: "README step 4: start the Spark job"
        run: nohup python spark/streaming_job.py > spark.log 2>&1 &

      - name: "README step 5: start the producer"
        run: |
          sleep 20
          nohup python producer/producer.py > producer.log 2>&1 &
          sleep 15
          tail -3 producer.log

      - name: Wait until Spark has written real data (Bronze, then Gold)
        run: |
          python - <<'PY'
          import glob, os, subprocess, sys, time
          import pandas as pd

          def rows(path):
              n = 0
              for f in glob.glob(path + "/*.parquet"):
                  if time.time() - os.path.getmtime(f) < 3:
                      continue  # Spark may still be writing this file
                  r = subprocess.run(
                      [sys.executable, "-c",
                       "import pyarrow.parquet as pq, sys; print(pq.read_metadata(sys.argv[1]).num_rows)", f],
                      capture_output=True, text=True)
                  if r.returncode == 0:
                      n += int(r.stdout.strip())
              return n

          def alive(pattern):
              return subprocess.run(["pgrep", "-f", pattern], capture_output=True).returncode == 0

          def wait(path, minimum, seconds, label, process):
              start = time.time()
              while time.time() - start < seconds:
                  n = rows(path)
                  if n >= minimum:
                      print(f"{label}: {n} rows after {int(time.time() - start)}s")
                      return
                  if not alive(process):
                      print(f"::error::the Spark job stopped before {label} had data (rows so far: {n})")
                      sys.exit(1)
                  time.sleep(5)
              print(f"::error::{label}: only {rows(path)} rows after {seconds}s (needed {minimum})")
              sys.exit(1)

          wait("data/bronze", 500, 300, "bronze", "streaming_job.py")
          wait("data/gold", 1, 480, "gold windows (need ~4 minutes of events)", "streaming_job.py")
          PY

      - name: Stop Spark and the producer (so the output files are complete)
        run: |
          pkill -f streaming_job.py || true
          pkill -f producer.py || true
          sleep 5

      - name: Check the output
        run: |
          python - <<'PY'
          import glob, sys
          import pandas as pd

          def read_all(path):
              parts = []
              for f in sorted(glob.glob(path + "/*.parquet")):
                  try:
                      parts.append(pd.read_parquet(f))
                  except Exception:
                      pass  # a file cut short when Spark was stopped
              return pd.concat(parts, ignore_index=True) if parts else pd.DataFrame()

          b = read_all("data/bronze")
          g = read_all("data/gold")
          print("bronze rows:", len(b), "| columns:", list(b.columns))
          print("gold rows:", len(g), "| columns:", list(g.columns))
          need_b = {"transaction_id", "amount", "is_fraud", "event_time"}
          need_g = {"window_start", "tx_count", "total_amount", "fraud_total"}
          if not need_b <= set(b.columns) or not need_g <= set(g.columns):
              print(f"::error::unexpected columns. bronze={list(b.columns)} gold={list(g.columns)}")
              sys.exit(1)
          if len(b) < 500 or g["tx_count"].sum() <= 0:
              print(f"::error::too little data: bronze={len(b)} rows, gold tx_count total={g['tx_count'].sum()}")
              sys.exit(1)
          print("pipeline output ok")
          PY

      - name: "README step 6: the dashboard opens without errors"
        run: |
          pip install pytest >/dev/null
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("dashboard/app.py", default_timeout=120).run()
          assert not at.exception, [e.value for e in at.exception]
          print("dashboard ok")
          PY

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- producer"; tail -20 producer.log || true
          echo "--- spark"; tail -60 spark.log || true
          docker compose logs --tail 40 redpanda || true

      - name: Tear down
        if: always()
        run: |
          pkill -f producer.py || true
          pkill -f streaming_job.py || true
          docker compose down -v
