name: Pipeline check

# Runs the real pipeline: Redpanda and its schema registry (Docker) -> producer -> Spark
# Structured Streaming -> Delta tables, then proves the claims the README makes:
#   - the registry rejects an incompatible schema, and a message sent without it is quarantined
#   - the health check passes while the stream runs and fails after it stops
#   - killing the job mid-stream and restarting it loses and repeats nothing
#   - compaction runs while the stream writes, with the same rows before and after
on:
  push:
    paths:
      - requirements.txt
      - "spark/**"
      - "producer/**"
      - "contract/**"
      - "dashboard/**"
      - docker-compose.yml
      - ".github/workflows/pipeline-check.yml"
  workflow_dispatch:

jobs:
  streaming:
    name: Redpanda + Spark
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Spark downloads the Kafka and Delta jars from Maven on first start; caching them keeps a
      # Maven hiccup from failing the run (it did once, on 2026-11-27).
      - name: Cache the Spark jars (Maven via Ivy)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-spark-3.5.8-delta-3.3.2-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ivy-spark-3.5.8-delta-3.3.2-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "README step 2: install the dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      # The next steps follow the README ("Running it") in the same order.
      - name: "README step 3, first command: docker compose up -d (Redpanda and the console)"
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' redpanda)" = "healthy" ]; then echo "redpanda is healthy"; break; fi
            sleep 3
          done
          docker compose ps

      - name: "README step 3, second command: create the topic with 3 partitions"
        run: |
          # The README uses "docker exec -it"; -it needs a terminal, which a CI job does not have.
          docker exec redpanda rpk topic create transactions -p 3
          docker exec redpanda rpk topic describe transactions | tee topic.txt
          grep -E "PARTITIONS[[:space:]]+3" topic.txt

      - name: The Redpanda Console answers on port 8080
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080 >/dev/null; then echo "console is up on port 8080"; exit 0; fi
            sleep 3
          done
          echo "::error::the Redpanda Console did not answer on port 8080"
          docker compose logs --tail 30 console || true
          exit 1

      - name: "README step 4: register the event schema (BACKWARD compatibility)"
        run: |
          python contract/registry.py register
          python contract/registry.py show

      - name: The registry rejects an incompatible schema (amount as a string)
        run: |
          if python contract/registry.py check tests/fixtures/incompatible.schema.json; then
            echo "::error::the registry accepted an incompatible schema"; exit 1
          fi
          python contract/registry.py check contract/transactions-value.schema.json

      - name: Download the Spark jars (retried; cached for the next run)
        run: |
          for i in 1 2 3; do
            python -c "from spark.session import build_spark; build_spark('prefetch', master='local[1]', kafka=True).stop()" && exit 0
            echo "jar download failed (attempt $i), retrying"; sleep 30
          done
          exit 1

      - name: "README step 5: start the Spark job"
        run: nohup python spark/streaming_job.py > spark.log 2>&1 &

      - name: "README step 6: start the producer"
        run: |
          sleep 25
          nohup python producer/producer.py > producer.log 2>&1 &
          sleep 15
          tail -3 producer.log

      - name: A message sent without the schema registry goes to quarantine
        run: |
          echo '{"transaction_id":"raw-unregistered-1","card_id":"card_0001","amount":10.0,"merchant":"m","category":"groceries","city":"Recife","timestamp":"2026-01-01T10:00:00+00:00","is_fraud":false,"fraud_type":null}' \
            | docker exec -i redpanda rpk topic produce transactions -k card_0001

      - name: Wait until Spark has written real data (Bronze, then Gold)
        run: |
          python - <<'PY'
          import subprocess, sys, time
          from deltalake import DeltaTable

          def rows(path):
              try:
                  return len(DeltaTable(path).to_pandas())
              except Exception:
                  return 0  # the table does not exist yet

          def wait(path, minimum, seconds, label):
              start = time.time()
              while time.time() - start < seconds:
                  n = rows(path)
                  if n >= minimum:
                      print(f"{label}: {n} rows after {int(time.time() - start)}s")
                      return
                  if subprocess.run(["pgrep", "-f", "streaming_job.py"]).returncode != 0:
                      sys.exit(f"::error::the Spark job stopped before {label} had data")
                  time.sleep(5)
              sys.exit(f"::error::{label}: only {rows(path)} rows after {seconds}s (needed {minimum})")

          wait("data/delta/bronze", 500, 300, "bronze")
          wait("data/delta/gold", 1, 480, "gold windows (need ~4 minutes of events)")
          PY

      - name: Health check passes while the stream runs
        run: python spark/health.py

      - name: Kill the Spark job mid-stream (SIGKILL, no clean shutdown) and restart it
        run: |
          pkill -9 -f streaming_job.py || true
          pkill -9 -f org.apache.spark.deploy.SparkSubmit || true
          sleep 15
          nohup python spark/streaming_job.py > spark-restart.log 2>&1 &
          sleep 60
          tail -5 spark-restart.log

      - name: Compaction while the stream keeps writing
        run: python spark/maintenance.py

      - name: Every Kafka record is in Bronze exactly once after the crash
        run: |
          pkill -f producer.py || true
          sleep 45   # two triggers: Spark reads the last records
          python spark/maintenance.py --skip-compaction --check-duplicates

      - name: Check the output (contents, quarantine, lineage)
        run: |
          python - <<'PY'
          import sys
          from deltalake import DeltaTable

          b = DeltaTable("data/delta/bronze").to_pandas()
          g = DeltaTable("data/delta/gold").to_pandas()
          q = DeltaTable("data/delta/quarantine").to_pandas()
          print("bronze rows:", len(b), "| gold windows:", len(g), "| quarantined:", len(q))
          need_b = {"transaction_id", "amount", "is_fraud", "event_time", "kafka_partition", "kafka_offset", "schema_id"}
          need_g = {"window_start", "tx_count", "total_amount", "fraud_total"}
          if not need_b <= set(b.columns) or not need_g <= set(g.columns):
              sys.exit(f"::error::unexpected columns. bronze={list(b.columns)} gold={list(g.columns)}")
          if len(b) < 500 or g["tx_count"].sum() <= 0:
              sys.exit(f"::error::too little data: bronze={len(b)}, gold tx_count={g['tx_count'].sum()}")
          if g["window_start"].duplicated().any():
              sys.exit("::error::a Gold window was written twice")
          raw = q[q["raw_value"].str.contains("raw-unregistered-1")]
          if raw.empty or "unregistered_schema" not in list(raw.iloc[0]["violations"]):
              sys.exit("::error::the unregistered message is not in quarantine with unregistered_schema")
          registered = b[b["schema_id"].notna()]
          print("schema ids in bronze:", sorted(registered["schema_id"].unique()))
          print("pipeline output ok")
          PY

      - name: Health check fails once the job is stopped
        run: |
          pkill -f streaming_job.py || true
          sleep 100
          if python spark/health.py > health.txt 2>&1; then
            cat health.txt; echo "::error::health passed with the job stopped"; exit 1
          fi
          cat health.txt
          grep -Eq "stale progress|terminated" health.txt

      - name: "README step 7: the dashboard opens without errors"
        run: |
          pip install pytest >/dev/null
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("dashboard/app.py", default_timeout=120).run()
          assert not at.exception, [e.value for e in at.exception]
          print("dashboard ok")
          PY

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- producer"; tail -20 producer.log || true
          echo "--- spark"; tail -60 spark.log || true
          echo "--- spark after restart"; tail -60 spark-restart.log || true
          echo "--- progress"; tail -20 data/ops/progress.jsonl || true
          docker compose logs --tail 40 redpanda || true

      - name: Tear down
        if: always()
        run: |
          pkill -f producer.py || true
          pkill -f streaming_job.py || true
          docker compose down -v
