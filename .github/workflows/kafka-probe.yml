name: Kafka probe (Windows)

# Temporary diagnostic: starts Apache Kafka on a Windows machine step by step and prints what every command
# printed, so the Windows check can be fixed without guessing. It is removed once the Windows check passes.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kafka-probe.yml"

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download and extract Kafka into the SHORT path C:\k
        run: |
          set +e
          dl() {
            curl -fsSL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 420 -o kafka.tgz "$1" \
              && [ "$(stat -c %s kafka.tgz)" -gt 50000000 ]
          }
          used=none
          for u in https://archive.apache.org/dist/kafka/3.7.1/kafka_2.13-3.7.1.tgz \
                   https://dlcdn.apache.org/kafka/3.9.1/kafka_2.13-3.9.1.tgz \
                   https://downloads.apache.org/kafka/3.9.1/kafka_2.13-3.9.1.tgz \
                   https://archive.apache.org/dist/kafka/3.9.1/kafka_2.13-3.9.1.tgz; do
            if dl "$u"; then used=$u; break; fi
            echo "::notice::download failed from $u"
          done
          echo "::notice::kafka downloaded from $used size=$(stat -c %s kafka.tgz 2>/dev/null)"
          [ "$used" != none ] || exit 1
          mkdir -p /c/k
          tar -xzf kafka.tgz -C /c/k --strip-components=1
          echo "::notice::tar exit=$? | $(ls /c/k | tr '\n' ' ')"
          echo "::notice::java: $(java -version 2>&1 | head -1) | JAVA_HOME=$JAVA_HOME"

      - name: random-uuid and format
        run: |
          set +e
          cd /c/k
          out=$(cmd.exe //c "bin\\windows\\kafka-storage.bat random-uuid" 2>&1); code=$?
          echo "::notice::random-uuid exit=$code out=$(echo "$out" | tr -d '\r' | tr '\n' '|' | cut -c1-500)"
          id=$(echo "$out" | tr -d '\r' | tail -1)
          cat > config/kraft/windows-test.properties <<'PROPS'
          process.roles=broker,controller
          node.id=1
          controller.quorum.voters=1@localhost:19093
          listeners=PLAINTEXT://localhost:19092,CONTROLLER://localhost:19093
          advertised.listeners=PLAINTEXT://localhost:19092
          controller.listener.names=CONTROLLER
          inter.broker.listener.name=PLAINTEXT
          listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          log.dirs=C:/kafka-logs
          num.partitions=3
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
          PROPS
          out=$(cmd.exe //c "bin\\windows\\kafka-storage.bat format -t $id -c config\\kraft\\windows-test.properties" 2>&1); code=$?
          echo "::notice::format exit=$code out=$(echo "$out" | tr -d '\r' | tr '\n' '|' | cut -c1-700)"
          [ $code -eq 0 ] || exit 1

      - name: Start the broker, create the topic
        run: |
          set +e
          cd /c/k
          nohup cmd.exe //c "bin\\windows\\kafka-server-start.bat config\\kraft\\windows-test.properties" > /c/kafka.log 2>&1 &
          up=0
          for i in $(seq 1 60); do
            # the Kafka .bat tools always exit with 0 on Windows, so readiness is the TCP port itself:
            # curl code 7 (refused) or 28 (timeout) means closed; anything else means something answered
            curl -s --connect-timeout 2 -m 3 http://127.0.0.1:19092 >/dev/null 2>&1; c=$?
            if [ $c -ne 7 ] && [ $c -ne 28 ] && [ $c -ne 6 ]; then up=1; echo "broker port 19092 is open after about $((i*3))s (curl code $c)"; break; fi
            sleep 3
          done
          if [ "$up" != "1" ]; then
            echo "::error::the Kafka broker did not open port 19092: $(tail -25 /c/kafka.log | tr -d '\r' | tr '\n' '|' | cut -c1-1500)"
            exit 1
          fi
          sleep 8
          cmd.exe //c "bin\\windows\\kafka-topics.bat --bootstrap-server localhost:19092 --create --topic transactions --partitions 3" > /c/topic-create.log 2>&1
          cat /c/topic-create.log
          grep -q "Created topic" /c/topic-create.log || {
            echo "::error::topic creation failed: $(tail -8 /c/topic-create.log | tr -d '\r' | tr '\n' '|' | cut -c1-900) || broker log: $(tail -15 /c/kafka.log | tr -d '\r' | tr '\n' '|' | cut -c1-900)"; exit 1; }
          cmd.exe //c "bin\\windows\\kafka-topics.bat --bootstrap-server localhost:19092 --describe --topic transactions" | tee /c/topic.txt
          grep -q "PartitionCount: 3\|PartitionCount:3" /c/topic.txt
          echo "::notice::topic ok: $(cat /c/topic.txt | tr -d '\r' | tr '\n' '|' | cut -c1-600)"
