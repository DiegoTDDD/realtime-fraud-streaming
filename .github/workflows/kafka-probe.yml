name: Kafka probe (Windows)

# Temporary diagnostic: starts Apache Kafka on a Windows machine step by step and prints what every command
# printed, so the Windows check can be fixed without guessing. It is removed once the Windows check passes.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kafka-probe.yml"

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download and extract Kafka into the SHORT path C:\k
        run: |
          set +e
          dl() {
            curl -fsSL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 420 -o kafka.tgz "$1" \
              && [ "$(stat -c %s kafka.tgz)" -gt 50000000 ]
          }
          used=none
          for u in https://archive.apache.org/dist/kafka/3.7.1/kafka_2.13-3.7.1.tgz \
                   https://dlcdn.apache.org/kafka/3.9.1/kafka_2.13-3.9.1.tgz \
                   https://downloads.apache.org/kafka/3.9.1/kafka_2.13-3.9.1.tgz \
                   https://archive.apache.org/dist/kafka/3.9.1/kafka_2.13-3.9.1.tgz; do
            if dl "$u"; then used=$u; break; fi
            echo "::notice::download failed from $u"
          done
          echo "::notice::kafka downloaded from $used size=$(stat -c %s kafka.tgz 2>/dev/null)"
          [ "$used" != none ] || exit 1
          mkdir -p /c/k
          tar -xzf kafka.tgz -C /c/k --strip-components=1
          echo "::notice::tar exit=$? | $(ls /c/k | tr '\n' ' ')"
          echo "::notice::java: $(java -version 2>&1 | head -1) | JAVA_HOME=$JAVA_HOME"

      - name: Configure, format and start the broker with Java directly, create the topic
        run: |
          set +e
          cd /c/k
          cat > config/kraft/windows-test.properties <<'PROPS'
          process.roles=broker,controller
          node.id=1
          controller.quorum.voters=1@localhost:19093
          listeners=PLAINTEXT://localhost:19092,CONTROLLER://localhost:19093
          advertised.listeners=PLAINTEXT://localhost:19092
          controller.listener.names=CONTROLLER
          inter.broker.listener.name=PLAINTEXT
          listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          log.dirs=C:/kafka-logs
          num.partitions=3
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
          PROPS
          K=C:/k
          # The Kafka .bat tools are not used: they need wmic (gone from current Windows images), overflow cmd.exe's
          # line limit and always exit with 0. Java is called directly instead.
          id=$(java -cp "$K/libs/*" kafka.tools.StorageTool random-uuid | tr -d '\r' | tail -1)
          echo "cluster id: $id"
          java -cp "$K/libs/*" kafka.tools.StorageTool format -t "$id" -c "$K/config/kraft/windows-test.properties" > /c/format.log 2>&1 || {
            echo "::error::kafka-storage format failed: $(tail -8 /c/format.log | tr -d '\r' | tr '\n' '|' | cut -c1-900)"; exit 1; }
          nohup java -Xmx1G -Xms1G -Dlog4j.configuration=file:$K/config/log4j.properties -Dkafka.logs.dir=$K/logs \
            -cp "$K/libs/*" kafka.Kafka "$K/config/kraft/windows-test.properties" > /c/kafka.log 2>&1 &
          up=0
          for i in $(seq 1 60); do
            curl -s --connect-timeout 2 -m 3 http://127.0.0.1:19092 >/dev/null 2>&1; c=$?
            if [ $c -ne 7 ] && [ $c -ne 28 ] && [ $c -ne 6 ]; then up=1; echo "broker port 19092 is open after about $((i*3))s (curl code $c)"; break; fi
            sleep 3
          done
          if [ "$up" != "1" ]; then
            echo "::error::the Kafka broker did not open port 19092: console: $(tail -15 /c/kafka.log | tr -d '\r' | tr '\n' '|' | cut -c1-700) || server.log: $(tail -25 $K/logs/server.log 2>/dev/null | tr -d '\r' | tr '\n' '|' | cut -c1-1200)"
            exit 1
          fi
          sleep 5
          java -cp "$K/libs/*" kafka.admin.TopicCommand --bootstrap-server localhost:19092 --create --topic transactions --partitions 3 > /c/topic-create.log 2>&1 || {
            echo "::error::topic creation failed: $(tail -8 /c/topic-create.log | tr -d '\r' | tr '\n' '|' | cut -c1-900)"; exit 1; }
          cat /c/topic-create.log
          java -cp "$K/libs/*" kafka.admin.TopicCommand --bootstrap-server localhost:19092 --describe --topic transactions | tee /c/topic.txt
          grep -q "PartitionCount: 3\|PartitionCount:3" /c/topic.txt
          echo "::notice::topic ok: $(cat /c/topic.txt | tr -d '\r' | tr '\n' '|' | cut -c1-600)"
